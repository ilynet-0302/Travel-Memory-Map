services:
  postgres:
    image: postgres:17-alpine
    container_name: travel-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_memory}
      POSTGRES_USER: ${POSTGRES_USER:-travel_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_memory}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - travel-memory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_memory} -d ${POSTGRES_DB:-travel_memory}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  travel-memory-postgres-data:
