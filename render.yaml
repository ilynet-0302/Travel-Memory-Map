services:
  - type: web
    name: travel-memory-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_AUTH_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWS_ALGORITHMS
        value: ES256
      - key: SUPABASE_PHOTO_BUCKET
        value: trip-photos
      - key: SUPABASE_SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ROUTING_ENABLED
        value: "true"
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: ROUTING_PROFILE
        value: driving
