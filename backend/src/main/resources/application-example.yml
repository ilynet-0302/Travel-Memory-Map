spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_memory
    username: travel_memory
    password: change-me
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://your-project.supabase.co/auth/v1
          jwk-set-uri: https://your-project.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated

app:
  cors:
    allowed-origins: https://username.github.io
  supabase:
    signed-url-ttl-seconds: 900
  rate-limit:
    enabled: true
