spring:
  application:
    name: travel-memory-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/travel_memory}
    username: ${DATABASE_USERNAME:travel_memory}
    password: ${DATABASE_PASSWORD:travel_memory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:http://localhost:54321/auth/v1}
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
