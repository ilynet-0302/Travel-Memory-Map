spring:
  application:
    name: travel-memory-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/travel_memory}
    username: ${DATABASE_USERNAME:travel_memory}
    password: ${DATABASE_PASSWORD:travel_memory}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:http://localhost:54321/auth/v1}
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
          jws-algorithms: ${SUPABASE_JWS_ALGORITHMS:ES256}
          audiences: ${SUPABASE_AUTH_AUDIENCE:authenticated}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:${VITE_SUPABASE_URL:http://localhost:54321}}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:local-publishable-key}}
    photo-bucket: ${SUPABASE_PHOTO_BUCKET:trip-photos}
    signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL_SECONDS:900}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    public-requests-per-minute: ${PUBLIC_RATE_LIMIT_PER_MINUTE:60}
    invite-previews-per-minute: ${INVITE_PREVIEW_RATE_LIMIT_PER_MINUTE:30}
    uploads-per-hour: ${PHOTO_UPLOAD_RATE_LIMIT_PER_HOUR:30}
    invites-per-hour: ${INVITE_CREATE_RATE_LIMIT_PER_HOUR:30}
    replays-per-minute: ${REPLAY_RATE_LIMIT_PER_MINUTE:30}
  routing:
    enabled: ${ROUTING_ENABLED:false}
    base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
    profile: ${ROUTING_PROFILE:driving}
    connect-timeout-seconds: ${ROUTING_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${ROUTING_READ_TIMEOUT_SECONDS:8}
